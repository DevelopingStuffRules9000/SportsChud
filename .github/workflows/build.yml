name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # A tag must match package.json, otherwise the installed app would think it is out of date
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json version $v. Fix the version, commit, and tag again."
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SportsChud-Installer
          path: dist/*.exe

      # Pushing a version tag (e.g. v0.3.5) also publishes the installer as a GitHub Release,
      # so https://github.com/<owner>/<repo>/releases/latest/download/SportsChud-Setup.exe
      # always points at the newest version.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/SportsChud-Setup.exe --title "SportsChud ${{ github.ref_name }}" --generate-notes