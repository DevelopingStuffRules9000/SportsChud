<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SportsChud</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora"></div>
  <div class="app">
    <aside class="side">
      <div class="brand drag"><img class="mark" src="icon.png" alt="" /><span>Sports Chud</span></div>
      <nav id="nav"></nav>
      <button id="navlock" class="navlock" title="Lock or unlock sidebar order"></button>
      <div class="spacer"></div>
      <button id="test" class="ghost">Send test alert</button>
      <button class="nav" id="navSettings" data-view="settings"><i>⚙</i> Settings</button>
    </aside>
    <main>
      <header class="top drag">
        <div id="hact" class="hact"></div>
        <div class="hname">
          <p id="sub" class="sub"></p>
          <span class="hsep" aria-hidden="true">|</span>
          <h1 id="title">Scores</h1>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
